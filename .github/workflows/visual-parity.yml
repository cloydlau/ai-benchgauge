name: Native visual comparison
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/macos/Sources/**'
      - 'apps/windows/BenchGauge/**'
      - 'tests/fixtures/visual-state.json'
      - 'Scripts/*visual*'
      - '.github/workflows/visual-parity.yml'
  push:
    branches: [main, "codex/visual-parity-*"]
    paths:
      - 'apps/macos/Sources/**'
      - 'apps/windows/BenchGauge/**'
      - 'tests/fixtures/visual-state.json'
      - 'Scripts/*visual*'
      - '.github/workflows/visual-parity.yml'
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Capture native Mac windows from the same fixture
        run: zsh Scripts/capture-macos-visual.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-visual-macos
          path: work/visual-parity/macos/
          if-no-files-found: error
  windows:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.401'
      - name: Build the native WPF application
        run: dotnet build apps/windows/BenchGauge/BenchGauge.csproj -c Release -o work/visual-app
      - name: Capture real Windows client pixels
        shell: pwsh
        run: |
          $process = Start-Process work/visual-app/AI-BenchGauge.exe -ArgumentList '--visual-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            Get-Content work/visual-parity/windows/failed.txt -ErrorAction SilentlyContinue
            throw "Native window capture failed ($($process.ExitCode))"
          }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-visual-windows
          path: work/visual-parity/windows/
          if-no-files-found: error
  comparison:
    needs: [macos, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/download-artifact@v8
        with:
          name: native-visual-windows
          path: work/visual-parity/windows/
      - uses: actions/download-artifact@v8
        with:
          name: native-visual-macos
          path: work/visual-parity/macos/
      - name: Verify fixture and viewport, build the comparison report
        run: node Scripts/visual-report.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: native-visual-comparison
          path: |
            work/visual-parity/comparison.html
            work/visual-parity/coverage.json
