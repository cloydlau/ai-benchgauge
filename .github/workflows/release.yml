name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  actions: read
concurrency:
  group: stable-release
  cancel-in-progress: false
jobs:
  visual:
    uses: ./.github/workflows/visual-parity.yml
    with:
      require_review: true
  windows:
    uses: ./.github/workflows/windows-build.yml
    with:
      installer: true
  macos:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      CALMMIT_PATH: ${{ github.workspace }}/.calmmit-library
      DESKTOP_NOTIFY: '0'
      TEST_AUTO_REPAIR: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require shared CI source repository
        env:
          CALMMIT_REPOSITORY: ${{ vars.CALMMIT_REPOSITORY }}
          CALMMIT_SHA: ${{ vars.CALMMIT_SHA }}
        run: |
          test -n "$CALMMIT_REPOSITORY" || { echo "Set CALMMIT_REPOSITORY to the shared library repository." >&2; exit 1; }
          [[ "$CALMMIT_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Set CALMMIT_SHA to a reviewed immutable commit SHA." >&2; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ vars.CALMMIT_REPOSITORY }}
          ref: ${{ vars.CALMMIT_SHA }}
          path: .calmmit-library
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.401'
      - name: Validate shared app configuration
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node Scripts/validate-app-config.mjs "$RELEASE_TAG"
      - name: Validate tag, update configuration, and increasing version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          SIGNING_KEY_PRESENT: ${{ secrets.SPARKLE_PRIVATE_KEY != '' }}
        run: |
          if [ "$SIGNING_KEY_PRESENT" != "true" ]; then echo 'Configure GitHub Secret SPARKLE_PRIVATE_KEY first.' >&2; exit 1; fi
          git merge-base --is-ancestor HEAD origin/main
          mkdir -p work
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isDraft,isPrerelease > work/prior-releases.json
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs'
          import { execFileSync } from 'node:child_process'
          import { validateRelease } from './Scripts/release-lib.mjs'
          const info = JSON.parse(execFileSync('plutil', ['-convert', 'json', '-o', '-', 'apps/macos/Sources/Resources/Info.plist'], { encoding: 'utf8' }))
          validateRelease(process.env.RELEASE_TAG, info, JSON.parse(readFileSync('work/prior-releases.json', 'utf8')))
          JS
      - name: Resolve locked dependencies
        run: swift package resolve --disable-sandbox
      - name: Optional Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then exit 0; fi
          test -n "$APPLE_SIGNING_IDENTITY"
          keychain="$RUNNER_TEMP/release.keychain-db"
          certificate="$RUNNER_TEMP/release.p12"
          password="$(openssl rand -base64 32)"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$certificate" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          printf 'APP_SIGNING_IDENTITY=%s\n' "$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"
          rm -f "$certificate"
      - name: Tests and universal application
        run: |
          mkdir -p work
          set -o pipefail
          if ! node Scripts/ci-checks.mjs 2>&1 | tee work/macos-build.log; then
            node Scripts/report-ci-failure.mjs work/macos-build.log
            exit 1
          fi
        env:
          APP_UNIVERSAL: '1'
      - name: Optional notarization
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_ID" ]; then exit 0; fi
          test -n "$APP_SIGNING_IDENTITY"
          test -n "$APPLE_TEAM_ID"
          test -n "$APPLE_APP_PASSWORD"
          ditto -c -k --sequesterRsrc --keepParent outputs/AI-BenchGauge.app "$RUNNER_TEMP/notarization.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarization.zip" --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple outputs/AI-BenchGauge.app
      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$RELEASE_TAG" --jq .body > work/release-notes.md
      - name: Sign and verify release archive and feed
        run: node Scripts/package-release.mjs
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          RELEASE_NOTES_FILE: work/release-notes.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-release
          path: outputs/release/
          if-no-files-found: error
      - name: Clean up signing keychain
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/release.keychain-db" ]; then security delete-keychain "$RUNNER_TEMP/release.keychain-db"; fi
  publish:
    needs: [macos, windows, visual]
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: '*-release'
          path: outputs/release/
          merge-multiple: true
      - name: Verify both installers and sign Windows update metadata
        run: node Scripts/complete-release.mjs
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
      - name: Publish complete stable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" outputs/release/*.dmg outputs/release/*.exe outputs/release/appcast.xml outputs/release/windows-update.json outputs/release/windows-update.json.sig outputs/release/ai-benchgauge.rb outputs/release/SHA256SUMS.txt --verify-tag --draft --title "AI BenchGauge $RELEASE_TAG" --notes-file outputs/release/release-notes.md
          gh release edit "$RELEASE_TAG" --draft=false --latest
      - name: Publish Homebrew cask
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: node Scripts/publish-homebrew-cask.mjs
