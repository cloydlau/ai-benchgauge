name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.401'
      - name: Tests and packaged application
        run: |
          mkdir -p work
          set -o pipefail
          if ! node Scripts/ci-checks.mjs 2>&1 | tee work/macos-build.log; then
            node Scripts/report-ci-failure.mjs work/macos-build.log
            exit 1
          fi
        env:
          DESKTOP_NOTIFY: '0'
          TEST_AUTO_REPAIR: '0'
  windows:
    uses: ./.github/workflows/windows-build.yml
    with:
      installer: true
