name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  actions: read
jobs:
  visual:
    uses: ./.github/workflows/visual-parity.yml
  checks:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CALMMIT_PATH: ${{ github.workspace }}/.calmmit-library
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The screenshot gate reviews every commit in the pushed range.
          fetch-depth: 0
      - name: Require shared CI source repository
        env:
          CALMMIT_REPOSITORY: ${{ vars.CALMMIT_REPOSITORY }}
          CALMMIT_SHA: ${{ vars.CALMMIT_SHA }}
        run: |
          test -n "$CALMMIT_REPOSITORY" || { echo "Set CALMMIT_REPOSITORY to the shared library repository." >&2; exit 1; }
          [[ "$CALMMIT_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Set CALMMIT_SHA to a reviewed immutable commit SHA." >&2; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ vars.CALMMIT_REPOSITORY }}
          ref: ${{ vars.CALMMIT_SHA }}
          path: .calmmit-library
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.401'
      - name: Screenshots and recordings need review
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            node Scripts/media-gate-ci.mjs "$PR_BASE_SHA" "$HEAD_SHA"
          else
            node Scripts/media-gate-ci.mjs "$BEFORE_SHA" "$HEAD_SHA"
          fi
      - name: Tests and packaged application
        run: |
          mkdir -p work
          set -o pipefail
          if ! node Scripts/ci-checks.mjs 2>&1 | tee work/macos-build.log; then
            node Scripts/report-ci-failure.mjs work/macos-build.log
            exit 1
          fi
        env:
          APP_UNIVERSAL: '1'
          DESKTOP_NOTIFY: '0'
          TEST_AUTO_REPAIR: '0'
  windows:
    uses: ./.github/workflows/windows-build.yml
    with:
      installer: true
