name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Tests and packaged application
        run: node Scripts/ci-checks.mjs
        env:
          DESKTOP_NOTIFY: '0'
          TEST_AUTO_REPAIR: '0'
