name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          # The screenshot gate reviews every commit in the pushed range.
          fetch-depth: 0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.401'
      - name: Screenshots and recordings need review
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node Scripts/media-gate-ci.mjs "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}"
          else
            node Scripts/media-gate-ci.mjs "${{ github.event.before }}" "${{ github.sha }}"
          fi
      - name: Tests and packaged application
        run: |
          mkdir -p work
          set -o pipefail
          if ! node Scripts/ci-checks.mjs 2>&1 | tee work/macos-build.log; then
            node Scripts/report-ci-failure.mjs work/macos-build.log
            exit 1
          fi
        env:
          APP_UNIVERSAL: '1'
          DESKTOP_NOTIFY: '0'
          TEST_AUTO_REPAIR: '0'
  windows:
    uses: ./.github/workflows/windows-build.yml
    with:
      installer: true
