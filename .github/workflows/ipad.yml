name: iPad
on:
  workflow_dispatch:
  pull_request:
    paths: ['apps/ipad/**', 'Sources/LeaderboardKit/**', 'Package.swift', 'Package.resolved', 'Scripts/ipad*', '.github/workflows/ipad.yml']
  push:
    branches: [main, 'codex/ipad-support']
    tags: ['v*']
    paths: ['apps/ipad/**', 'Sources/LeaderboardKit/**', 'Package.swift', 'Package.resolved', 'Scripts/ipad*', '.github/workflows/ipad.yml']
permissions:
  contents: read
jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Build iPad app for simulator and device; run UI tests
        run: |
          mkdir -p work/ipad
          set -o pipefail
          node Scripts/ipad-build.mjs check 2>&1 | tee work/ipad/build.log
      - name: Preserve native build log and simulator results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ipad-test-results
          path: work/ipad/
          if-no-files-found: error
