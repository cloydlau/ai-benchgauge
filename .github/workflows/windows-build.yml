name: Windows build
on:
  workflow_call:
    inputs:
      installer:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.401'
      - uses: compnerd/gha-setup-swift@bbae8ce86bac5a3449f3992b3d88bc4ca25f2057 # v0.5.0
        with:
          swift-version: swift-6.4.0-release
          swift-build: 6.4.0-RELEASE
      - name: Tests, runtime closure and native UI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force work | Out-Null
          try {
            ./Scripts/make-windows.ps1 *>&1 | Tee-Object work/windows-build.log
          } catch {
            Add-Content work/windows-build.log ("Exception: " + $_.Exception.Message + "`n" + $_.InvocationInfo.PositionMessage + "`n" + $_.ScriptStackTrace)
            node Scripts/report-ci-failure.mjs work/windows-build.log
            throw
          }
      - name: Install NSIS
        if: inputs.installer
        shell: pwsh
        run: choco install nsis --version=3.11 -y --no-progress
      - name: Package installer
        if: inputs.installer
        shell: pwsh
        run: |
          try { ./Scripts/make-windows.ps1 -Installer -PackageOnly *>&1 | Tee-Object work/windows-package.log }
          catch { Add-Content work/windows-package.log ("Exception: " + $_.Exception.Message + "`n" + $_.InvocationInfo.PositionMessage); node Scripts/report-ci-failure.mjs work/windows-package.log; throw }
      - name: Install and uninstall with synthetic user data
        if: inputs.installer
        shell: pwsh
        run: |
          try { ./Scripts/installer-smoke.ps1 *>&1 | Tee-Object work/windows-installer-smoke.log }
          catch { Add-Content work/windows-installer-smoke.log ("Exception: " + $_.Exception.Message + "`n" + $_.InvocationInfo.PositionMessage); node Scripts/report-ci-failure.mjs work/windows-installer-smoke.log; throw }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: inputs.installer
        with:
          name: windows-release
          path: outputs/release/*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: windows-ui-smoke
          path: work/windows-ui-smoke/
          if-no-files-found: ignore
